{% extends "base.html" %}

{% block title %}SmartServe | Create Account{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-6 sm:py-10">
    <div class="bg-white border border-zinc-200/80 rounded-2xl p-6 sm:p-8 shadow-xs space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-1.5">
            <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center mx-auto shadow-xs">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-zinc-900 tracking-tight">Create your account</h1>
            <p class="text-xs text-zinc-500">Join as a homeowner or certified service specialist</p>
        </div>

        {% if error %}
        <div class="p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs flex items-center gap-2">
            <svg class="w-4 h-4 shrink-0 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Signup Form -->
        <form action="{{ url_for('signup') }}" method="POST" class="space-y-4 text-xs">
            
            <!-- Role Selection -->
            <div>
                <label class="block font-medium text-zinc-700 mb-1.5">Select Account Type</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="relative flex flex-col p-3 rounded-xl border border-zinc-200 cursor-pointer hover:border-indigo-500 has-checked:border-indigo-600 has-checked:ring-1 has-checked:ring-indigo-600/20 bg-white">
                        <input type="radio" name="role" value="customer" class="sr-only" checked>
                        <span class="text-xs font-bold text-zinc-900">Customer</span>
                        <span class="text-[10px] text-zinc-500 mt-0.5">Book home services</span>
                    </label>
                    <label class="relative flex flex-col p-3 rounded-xl border border-zinc-200 cursor-pointer hover:border-indigo-500 has-checked:border-indigo-600 has-checked:ring-1 has-checked:ring-indigo-600/20 bg-white">
                        <input type="radio" name="role" value="technician" class="sr-only" {% if role == 'technician' %}checked{% endif %}>
                        <span class="text-xs font-bold text-zinc-900">Technician</span>
                        <span class="text-[10px] text-zinc-500 mt-0.5">Field service provider</span>
                    </label>
                </div>
            </div>

            <div>
                <label class="block font-medium text-zinc-700 mb-1">Full Name</label>
                <input type="text" name="name" required value="{{ name or '' }}" placeholder="e.g. Tariqul Islam" class="w-full bg-white border border-zinc-300 rounded-lg px-3 py-2.5 text-zinc-900 text-xs focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
            </div>

            <div>
                <label class="block font-medium text-zinc-700 mb-1">Email Address</label>
                <input type="email" name="email" required value="{{ email or '' }}" placeholder="name@example.com" class="w-full bg-white border border-zinc-300 rounded-lg px-3 py-2.5 text-zinc-900 text-xs focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
            </div>

            <div>
                <label class="block font-medium text-zinc-700 mb-1">Password</label>
                <input type="password" name="password" required placeholder="Minimum 4 characters" class="w-full bg-white border border-zinc-300 rounded-lg px-3 py-2.5 text-zinc-900 text-xs focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
            </div>

            <div>
                <label class="block font-medium text-zinc-700 mb-1">Phone Number</label>
                <input type="text" name="phone" value="{{ phone or '' }}" placeholder="+880 1700-000000" class="w-full bg-white border border-zinc-300 rounded-lg px-3 py-2.5 text-zinc-900 text-xs font-mono focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
            </div>

            <div>
                <label class="block font-medium text-zinc-700 mb-1">Address / Area</label>
                <input type="text" name="address" value="{{ address or '' }}" placeholder="Saidpur Cantonment Area" class="w-full bg-white border border-zinc-300 rounded-lg px-3 py-2.5 text-zinc-900 text-xs focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
            </div>

            <button type="submit" class="w-full py-2.5 px-4 rounded-lg font-semibold text-xs bg-indigo-600 hover:bg-indigo-700 text-white transition shadow-xs">
                Create Account
            </button>
        </form>

        <div class="text-center pt-2 border-t border-zinc-100 text-xs text-zinc-500">
            Already have an account? 
            <a href="{{ url_for('login') }}" class="text-indigo-600 hover:text-indigo-700 font-semibold transition">Sign in</a>
        </div>

    </div>
</div>
{% endblock %}
